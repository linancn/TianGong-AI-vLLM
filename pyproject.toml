[project]
name = "tiangong-ai-vllm-serve"
version = "0.2.0"
description = "Docker-only model serving and standard-library operations tools."
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["black>=26", "ruff>=0.15", "pytest>=9"]

[tool.black]
target-version = ["py312"]
line-length = 100
extend-exclude = '/(\.venv|models|output)/'

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
